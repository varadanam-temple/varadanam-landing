<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#100b04"/>
      <stop offset="100%" style="stop-color:#1e1208"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6906"/>
      <stop offset="100%" style="stop-color:#FFB31D"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle mandala ring (decorative) -->
  <circle cx="980" cy="315" r="260" fill="none" stroke="rgba(255,179,29,0.06)" stroke-width="1"/>
  <circle cx="980" cy="315" r="200" fill="none" stroke="rgba(255,179,29,0.05)" stroke-width="1"/>
  <circle cx="980" cy="315" r="140" fill="none" stroke="rgba(255,179,29,0.07)" stroke-width="1"/>

  <!-- Top accent line -->
  <rect x="80" y="80" width="60" height="3" fill="url(#accent)" rx="2"/>

  <!-- Label -->
  <text x="80" y="148" font-family="Georgia, serif" font-size="13" fill="#FF6906" letter-spacing="3" font-weight="600">TEMPLE MANAGEMENT SOFTWARE</text>

  <!-- Main headline -->
  <text x="80" y="230" font-family="Georgia, serif" font-size="62" fill="#faf6ef" font-weight="400" letter-spacing="-1">Temple management,</text>
  <text x="80" y="308" font-family="Georgia, serif" font-size="62" fill="#faf6ef" font-weight="400" letter-spacing="-1">simplified.</text>

  <!-- Subtext -->
  <text x="80" y="378" font-family="Georgia, serif" font-size="22" fill="rgba(250,246,239,0.55)" font-style="italic">Online vazhipadu booking · Counter billing · Devotee management</text>
  <text x="80" y="412" font-family="Georgia, serif" font-size="22" fill="rgba(250,246,239,0.55)" font-style="italic">Built for Kerala temples.</text>

  <!-- Divider -->
  <rect x="80" y="460" width="480" height="1" fill="rgba(255,179,29,0.2)"/>

  <!-- Trust badge -->
  <text x="80" y="498" font-family="Georgia, serif" font-size="18" fill="rgba(250,246,239,0.45)">Trusted by 200+ temples across Kerala and India</text>

  <!-- Logo text -->
  <text x="80" y="570" font-family="Georgia, serif" font-size="28" fill="#FFB31D" font-weight="400" letter-spacing="2">varadanam.com</text>

  <!-- Bottom accent bar -->
  <rect x="0" y="618" width="1200" height="12" fill="url(#accent)" opacity="0.8"/>
</svg>
